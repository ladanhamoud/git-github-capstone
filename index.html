<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Simple Notes</h1>
        <p>Keep your thoughts organized.</p>
    </header>

    <main>
        <section class="notes">
            <h2>My Notes</h2>

            <article class="note">
                <h3>Welcome Note</h3>
                <p>This is my first note in the Simple Notes project.</p>
            </article>

            <article class="note">
                <h3>Git Practice</h3>
                <p>This project helps me practice Git and GitHub workflows.</p>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
